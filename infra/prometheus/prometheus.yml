global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fiapx-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: fiapx-video-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["video-service:8082"]

  - job_name: fiapx-processing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["processing-service:8083"]
